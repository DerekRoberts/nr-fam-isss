server:
  port: 8080
  shutdown: graceful
  # Behind the Caddy frontend / OpenShift route.
  forward-headers-strategy: framework
  error:
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: nr-fam-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # The whole API is snake_case in both directions, as it was under FastAPI and
  # Pydantic. The generated frontend client depends on it.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

  # ---------------------------------------------------------------------------
  # On-prem PostgreSQL. This repo does not deploy a database; the connection
  # details come from the ${NAME}-${ZONE}-database secret created by
  # common/openshift.init.yml.
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:default}
    hikari:
      pool-name: fam-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
      # Keep well under any on-prem idle-session reaper.
      max-lifetime: 900000

  # Outbound email through an SMTP relay, replacing GC Notify. No host means no
  # mail is sent - the local default, so running FAM against real data cannot
  # accidentally send to real people.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          ssl:
            # Jakarta Mail does not verify that the relay's certificate matches
            # the host we dialled unless asked to, so a STARTTLS session is
            # otherwise open to an active man in the middle. Not an env var:
            # there is no deployment that should turn this off.
            checkserveridentity: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  # ---------------------------------------------------------------------------
  # Flyway. Runs on start-up, before Hibernate validates.
  #
  # The migrations ship inside the jar, so the schema a build expects and the
  # code that expects it are the same artefact and cannot be deployed out of
  # step. There is no separate migrations image or init container any more.
  #
  # This means the runtime database user needs DDL rights on app_fam - it
  # creates tables now, not just rows. See migrations/dba/.
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    schemas: ${POSTGRES_SCHEMA:app_fam}
    default-schema: ${POSTGRES_SCHEMA:app_fam}
    # A non-empty schema with no history is an accident, not a starting point:
    # fail rather than silently skipping everything.
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    # Schema is owned by Flyway, never by Hibernate. Flyway has already run by
    # the time this validation happens.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:app_fam}
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  # ---------------------------------------------------------------------------
  # BC Gov SSO (Keycloak). Replaces the AWS Cognito user pool that upstream FAM
  # authenticated against. This service is a resource server only - it validates
  # access tokens, it does not perform the login redirect.
  # ---------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          # No default realm. A baked-in issuer is worse than none: it points at
          # whichever realm happened to be current when it was written, and a
          # wrong realm fails as "invalid token" rather than as configuration.
          # Supplied by KEYCLOAK_ISSUER_URI in every environment, and
          # application-local.yml for local development.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
          # Derived from the issuer unless overridden - they are always the same
          # realm, and letting them drift apart is its own failure mode.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:}/protocol/openid-connect/certs}

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    ca.bc.gov.nrs.fam: ${LOG_LEVEL:INFO}

fam:
  # Which FAM deployment this is: dev, test or prod. Replaces the TARGET_ENV
  # variable the AWS platform injected. Only "prod" permits the PROD instances of
  # the Forest Client API and IDIM proxy to be reached; anything else, including
  # an unrecognised value, uses their TEST instances.
  deployment-environment: ${FAM_DEPLOYMENT_ENVIRONMENT:dev}

  oidc:
    # FAM's own Keycloak client. Tokens on the internal API must carry this as
    # their authorized party (azp); the external API under /external is exempt,
    # since it exists for other applications' clients to call.
    #
    # Replaces jwt_validation.enforce_fam_client_token. Left blank the check is
    # skipped, which is the local-development default - deployed environments set
    # it.
    fam-client-id: ${FAM_OIDC_CLIENT_ID:}

  # Origins allowed to call this API. Upstream read a single ALLOW_ORIGIN env var
  # on AWS and fell back to "*" locally.
  cors:
    allowed-origins: ${ALLOW_ORIGIN:http://localhost:3000}

  # Outbound integrations. Base URLs and keys are per-environment; there are no
  # production defaults here on purpose.
  #
  # Timeouts are carried over from the Python services rather than normalised:
  # the IDIM search is materially slower than the lookups, which is why it gets
  # 20s of read budget where the others get 10s. Exceeding them surfaces as
  # HTTP 504 with failureCode UPSTREAM_TIMEOUT.
  # Expired access is removed on a timer, because nothing else can remove it:
  # CSS has no expiry concept, and BC Gov SSO issues the tokens so FAM cannot
  # filter roles out at sign-in the way the legacy application did.
  # Bulk upload. The cap is a refusal rather than a truncation: silently granting
  # the first N rows of a longer file is the worst outcome available.
  #
  # Directory lookups are made once per distinct person in the file, so rows do
  # not each cost one. What does not fold up is the granting - CSS takes one call
  # per assignment and they run in turn - so this number is really a statement
  # about how long one apply request may take.
  bulk-grant:
    max-rows: ${FAM_BULK_MAX_ROWS:1000}

  expiry:
    sweep:
      enabled: ${EXPIRY_SWEEP_ENABLED:true}
      # From the end of the previous run, so a slow sweep never overlaps itself.
      # An expiry is a date, so being half an hour late is invisible - and
      # sweeping more often only multiplies requests to CSS for nothing.
      interval: ${EXPIRY_SWEEP_INTERVAL:PT30M}
      initial-delay: ${EXPIRY_SWEEP_INITIAL_DELAY:PT2M}
      # The date is read where the person choosing it lives, not where the pod
      # runs: on UTC, a grant made "until today" would end hours early.
      zone: ${EXPIRY_SWEEP_ZONE:America/Vancouver}

  integration:
    forest-client:
      test:
        # The TEST host as a local-development fallback only. Every deployed
        # environment sets FC_API_BASE_URL_TEST from the fc_api_base_url_test
        # variable, and an env var set to empty overrides this default rather
        # than falling back to it - so the deploy always wins.
        base-url: ${FC_API_BASE_URL_TEST:https://nr-forest-client-api-test.api.gov.bc.ca}
        api-token: ${FC_API_TOKEN_TEST:}
      prod:
        base-url: ${FC_API_BASE_URL_PROD:}
        api-token: ${FC_API_TOKEN_PROD:}
      timeouts:
        connect: 5s
        read: 20s
      retry:
        max-attempts: 2
        delay: 2s
    # BC Gov Common Hosted Single Sign-On. Source of applications, roles and role
    # assignments. A confidential client: client_credentials, secret is
    # backend-only and never reaches the browser.
    css:
      # No defaults: the production CSS endpoints are not the right answer for a
      # sandbox, and a default that is silently wrong reads as "no applications"
      # rather than as misconfiguration. The deployment template supplies both.
      api-base-url: ${CSS_API_URL:}
      token-url: ${CSS_TOKEN_URL:}
      client-id: ${CSS_API_CLIENT_ID:}
      client-secret: ${CSS_API_CLIENT_SECRET:}
      # FAM's own CSS integration. Administering FAM is administering who
      # administers everything else, so only FAM_ADMIN may see or act on it.
      # Unset, that protection cannot be applied and startup says so.
      own-integration-id: ${CSS_OWN_INTEGRATION_ID:}
      # Keycloak's federated username suffix, per provider. Fixed values, not
      # deployment configuration: the standard realm's aliases are what they are,
      # and the assignment endpoint accepts only these two - the legacy `idir` is
      # rejected outright. Overridable by environment variable purely as an
      # escape hatch if the realm ever changes; nothing sets them.
      idp-aliases:
        idir: ${CSS_IDP_ALIAS_IDIR:azureidir}
        bceid-business: ${CSS_IDP_ALIAS_BCEID:bceidbusiness}
      timeouts:
        connect: 5s
        read: 20s

    # Envelope settings for outbound mail. The relay itself is configured under
    # spring.mail; these are the addresses FAM puts on the message.
    smtp:
      from: ${SMTP_FROM:}
      reply-to: ${SMTP_REPLY_TO:}

    # nr-user-lookup-api - the BC Gov identity directory, replacing the IDIM
    # proxy. Three instances, one per environment, chosen by the environment of
    # the application being administered.
    #
    # Not one instance shared between them: BCeID is deployed three times and the
    # same person is a different account with a different GUID in each, so a GUID
    # read from the wrong instance is one CSS cannot resolve when it assigns the
    # role - which it reports as a refusal nobody sees.
    #
    # Each host sits behind its own Keycloak, so each needs its own service
    # account and its own token URL. There is no shared account: a token minted
    # against one realm is not accepted by another.
    #
    # An instance left unconfigured is normal rather than an error - a lower
    # deployment has no production account. Leaving an instance's credentials
    # blank while setting its base URL sends its calls out unauthenticated;
    # setting only some of them is rejected at startup, because a half-configured
    # directory reads as "no results" rather than as a misconfiguration.
    user-lookup:
      # Which directory answers people searches. "api" is nr-user-lookup-api
      # through the instances below. "css" is the CSS API's own user search
      # through the team API account: nothing extra to deploy or onboard, but
      # IDIR people are found by name, email or GUID (never by login), Business
      # BCeID by GUID only, and only once they have signed in to a CSS
      # application in that environment. The instances below are ignored then.
      provider: ${USER_LOOKUP_PROVIDER:api}
      dev:
        base-url: ${USER_LOOKUP_BASE_URL_DEV:}
        token-url: ${USER_LOOKUP_TOKEN_URL_DEV:}
        client-id: ${USER_LOOKUP_CLIENT_ID_DEV:}
        client-secret: ${USER_LOOKUP_CLIENT_SECRET_DEV:}
        scope: ${USER_LOOKUP_SCOPE_DEV:}
      test:
        base-url: ${USER_LOOKUP_BASE_URL_TEST:}
        token-url: ${USER_LOOKUP_TOKEN_URL_TEST:}
        client-id: ${USER_LOOKUP_CLIENT_ID_TEST:}
        client-secret: ${USER_LOOKUP_CLIENT_SECRET_TEST:}
        scope: ${USER_LOOKUP_SCOPE_TEST:}
      prod:
        base-url: ${USER_LOOKUP_BASE_URL_PROD:}
        token-url: ${USER_LOOKUP_TOKEN_URL_PROD:}
        client-id: ${USER_LOOKUP_CLIENT_ID_PROD:}
        client-secret: ${USER_LOOKUP_CLIENT_SECRET_PROD:}
        scope: ${USER_LOOKUP_SCOPE_PROD:}
      timeouts:
        connect: 5s
        read: 20s

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
logging:
  level:
    ca.bc.gov.nrs.fam: DEBUG
