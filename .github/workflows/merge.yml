name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    steps:
      # Get PR number for squash merges to main
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1
  deploy-test:
    name: TEST Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_host: ${{ secrets.db_host }}
      db_name: ${{ secrets.db_name }}
      db_port: ${{ secrets.db_port }}
      db_user: ${{ secrets.db_user }}
      db_password: ${{ secrets.db_password }}
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      css_api_client_id: ${{ secrets.css_api_client_id }}
      css_api_client_secret: ${{ secrets.css_api_client_secret }}
      keycloak_sa_client_id_dev: ${{ secrets.keycloak_sa_client_id_dev }}
      keycloak_sa_client_secret_dev: ${{ secrets.keycloak_sa_client_secret_dev }}
      user_lookup_base_url_dev: ${{ secrets.user_lookup_base_url_dev }}
      keycloak_sa_client_id_test: ${{ secrets.keycloak_sa_client_id_test }}
      keycloak_sa_client_secret_test: ${{ secrets.keycloak_sa_client_secret_test }}
      user_lookup_base_url_test: ${{ secrets.user_lookup_base_url_test }}
      keycloak_sa_client_id_prod: ${{ secrets.keycloak_sa_client_id_prod }}
      keycloak_sa_client_secret_prod: ${{ secrets.keycloak_sa_client_secret_prod }}
      user_lookup_base_url_prod: ${{ secrets.user_lookup_base_url_prod }}
      fc_api_token_test: ${{ secrets.fc_api_token_test }}
      fc_api_token_prod: ${{ secrets.fc_api_token_prod }}
    with:
      environment: test
      target: test
      tag: ${{ needs.init.outputs.pr }}

  tests:
    name: Tests
    needs: [deploy-test]
    # The E2E job checks the repository out. A called workflow cannot hold more
    # than its caller grants, and this file sets `permissions: {}`.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test
      run_e2e: ${{ vars.RUN_E2E != 'false' }}
    secrets:
      e2e_idir_user: ${{ secrets.E2E_IDIR_USER }}
      e2e_idir_password: ${{ secrets.E2E_IDIR_PASSWORD }}
      e2e_target_idir: ${{ secrets.E2E_TARGET_IDIR }}

  deploy-prod:
    name: PROD Deploys (${{ needs.init.outputs.pr }})
    needs: [tests, init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_host: ${{ secrets.db_host }}
      db_name: ${{ secrets.db_name }}
      db_port: ${{ secrets.db_port }}
      db_user: ${{ secrets.db_user }}
      db_password: ${{ secrets.db_password }}
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      css_api_client_id: ${{ secrets.css_api_client_id }}
      css_api_client_secret: ${{ secrets.css_api_client_secret }}
      keycloak_sa_client_id_dev: ${{ secrets.keycloak_sa_client_id_dev }}
      keycloak_sa_client_secret_dev: ${{ secrets.keycloak_sa_client_secret_dev }}
      user_lookup_base_url_dev: ${{ secrets.user_lookup_base_url_dev }}
      keycloak_sa_client_id_test: ${{ secrets.keycloak_sa_client_id_test }}
      keycloak_sa_client_secret_test: ${{ secrets.keycloak_sa_client_secret_test }}
      user_lookup_base_url_test: ${{ secrets.user_lookup_base_url_test }}
      keycloak_sa_client_id_prod: ${{ secrets.keycloak_sa_client_id_prod }}
      keycloak_sa_client_secret_prod: ${{ secrets.keycloak_sa_client_secret_prod }}
      user_lookup_base_url_prod: ${{ secrets.user_lookup_base_url_prod }}
      fc_api_token_test: ${{ secrets.fc_api_token_test }}
      fc_api_token_prod: ${{ secrets.fc_api_token_prod }}
    with:
      environment: prod
      target: prod
      tag: ${{ needs.init.outputs.pr }}

  # Vanity TLS for forestaccess.nrs.gov.bc.ca on the PROD frontend Service.
  # Always runs (empty PEMs must fail). Sibling of promote/monitor-prod so an
  # expired cert fails Merge after containers have already rolled.
  route-tls:
    name: Route TLS (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: bcgov/actions-openshift/route-tls@9d7230d1b1533eb02e98b9bd23fe89825d5c8b41
        with:
          hostname: forestaccess.nrs.gov.bc.ca
          target_service: nr-fam-prod-frontend
          tls_certificate: ${{ secrets.TLS_CERTIFICATE }}
          tls_private_key: ${{ secrets.TLS_PRIVATE_KEY }}
          tls_ca_certificate: ${{ secrets.TLS_CA_CERTIFICATE }}
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}

  # Sync Sysdig email alerts for PROD. No-ops cleanly if SYSDIG_API_TOKEN is
  # unset or monitoring/alerts/ is empty — adoption is gradual. Alert
  # templates live in monitoring/alerts/ in this repo; add or remove files
  # there to customize the alert set.
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: bcgov/actions-openshift/sysdig-monitor@4dbe4f6d25d14cbdb01e525a302e61e31f96c3ed # v0.5.0
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ secrets.oc_namespace }}
          app: ${{ github.event.repository.name }}

  promote:
    name: Promote Images
    needs: [deploy-prod, init]
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.init.outputs.pr }}
          tags: prod
